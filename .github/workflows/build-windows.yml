name: C/C++ CI

permissions:
  contents: write

# pushes to main update the 'nightly' release, pushing a v* tag (e.g. v1.1.0) creates a versioned release
on:
  push:
    branches: ["main"]
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      # the tag must match TWASE_VERSION_STR, so the released DLL reports the same version
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".Substring(1)
          $match = Select-String -Path src/dll/Version.hpp -Pattern '#define TWASE_VERSION_STR "(.+)"'
          $version = $match.Matches[0].Groups[1].Value
          if ($version -ne $tag) {
            Write-Error "Tag ${{ github.ref_name }} does not match TWASE_VERSION_STR '$version' in src/dll/Version.hpp"
            exit 1
          }

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: configure xmake
        run: xmake f --disable_copy=y -y
      - name: Build with xmake
        run: xmake -y

      # package for release
      # the package should take the TWASE.dll and the winmm.dll from build/windows/x86/release/
      # move them to the following folder structure:
      # TWASE/TWASE.dll
      # winmm.dll
      - name: package for release
        run: |
          mkdir -p TWASE
          cp build/windows/x86/release/TWASE.dll TWASE/
          cp build/windows/x86/release/winmm.dll .
          Compress-Archive -Path TWASE, winmm.dll -DestinationPath TWASE-release.zip -Force

      # build artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: TWASE-release
          path: |
            TWASE/TWASE.dll
            winmm.dll

      # add to 'nightly' release
      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          overwrite_files: true
          files: TWASE-release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # versioned release for v* tags
      - name: Package versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        run: Rename-Item TWASE-release.zip "TWASE-${{ github.ref_name }}.zip"

      - name: Create versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TWASE ${{ github.ref_name }}
          files: TWASE-${{ github.ref_name }}.zip
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
