name: CI

permissions:
  contents: write

# pushes to main update the 'nightly' release, pushing a v* tag (e.g. v1.1.0) creates a versioned release.
# Run it by hand (Actions > CI > Run workflow) on any branch to get the build zips as artifacts, without a release.
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      # the tag must match TWASE_VERSION_STR, so the released DLL reports the same version
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".Substring(1)
          $match = Select-String -Path src/core/Version.hpp -Pattern '#define TWASE_VERSION_STR "(.+)"'
          $version = $match.Matches[0].Groups[1].Value
          if ($version -ne $tag) {
            Write-Error "Tag ${{ github.ref_name }} does not match TWASE_VERSION_STR '$version' in src/core/Version.hpp"
            exit 1
          }

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: configure xmake
        run: xmake f -m release --disable_copy=y -y
      - name: Build with xmake
        run: xmake -y

      # package for release:
      # TWASE/TWASE.dll
      # winmm.dll
      - name: package for release
        run: |
          mkdir -p TWASE
          cp build/windows/x86/release/TWASE.dll TWASE/
          cp build/windows/x86/release/winmm.dll .
          Compress-Archive -Path TWASE, winmm.dll -DestinationPath TWASE-release.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: TWASE-release
          path: TWASE-release.zip

  macos:
    # Apple Silicon, the game is arm64 only
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      # the tag must match TWASE_VERSION_STR, so the released dylib reports the same version
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/#define TWASE_VERSION_STR "\(.*\)"/\1/p' src/core/Version.hpp)
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match TWASE_VERSION_STR '$version' in src/core/Version.hpp"
            exit 1
          fi

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: configure xmake
        run: xmake f -m release --disable_copy=y -y
      - name: Build with xmake
        run: xmake -y

      # package for release:
      # twase-launch.command
      # TWASE/libTWASE.dylib
      - name: package for release
        run: |
          mkdir -p package/TWASE
          cp build/macosx/arm64/release/libTWASE.dylib package/TWASE/
          cp src/platform/macos/launcher/twase-launch.command package/
          cp src/platform/macos/launcher/twase-appstore.command package/
          chmod +x package/twase-launch.command package/twase-appstore.command
          codesign --force --sign - package/TWASE/libTWASE.dylib
          cd package && zip -r -y ../TWASE-macOS-release.zip twase-launch.command twase-appstore.command TWASE

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: TWASE-macOS-release
          path: TWASE-macOS-release.zip

  # one release with both zips, once both builds succeeded
  release:
    if: github.event_name == 'push'
    needs: [windows, macos]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      # add to 'nightly' release
      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          prerelease: true
          overwrite_files: true
          files: |
            TWASE-release.zip
            TWASE-macOS-release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # versioned release for v* tags
      - name: Package versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mv TWASE-release.zip "TWASE-${GITHUB_REF_NAME}.zip"
          mv TWASE-macOS-release.zip "TWASE-macOS-${GITHUB_REF_NAME}.zip"

      - name: Create versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: TWASE ${{ github.ref_name }}
          files: |
            TWASE-${{ github.ref_name }}.zip
            TWASE-macOS-${{ github.ref_name }}.zip
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
