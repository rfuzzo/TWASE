name: macOS CI

permissions:
  contents: write

# pushes to main update the 'nightly' release, pushing a v* tag (e.g. v1.1.0) creates a versioned release
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    # Apple Silicon, the game is arm64 only
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      # the tag must match TWASE_VERSION_STR, so the released dylib reports the same version
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/#define TWASE_VERSION_STR "\(.*\)"/\1/p' src/dylib/Version.hpp)
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match TWASE_VERSION_STR '$version' in src/dylib/Version.hpp"
            exit 1
          fi

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: configure xmake
        run: xmake f -m release --disable_copy=y -y

      - name: Build with xmake
        run: xmake -y

      # package for release:
      # twase-launch.command
      # TWASE/libTWASE.dylib
      - name: package for release
        run: |
          mkdir -p package/TWASE
          cp build/macosx/arm64/release/libTWASE.dylib package/TWASE/
          cp scripts/twase-launch.command package/
          chmod +x package/twase-launch.command
          codesign --force --sign - package/TWASE/libTWASE.dylib
          cd package && zip -r -y ../TWASE-macOS-release.zip twase-launch.command TWASE

      # build artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: TWASE-macOS-release
          path: TWASE-macOS-release.zip

      # add to 'nightly' release
      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          prerelease: true
          overwrite_files: true
          files: TWASE-macOS-release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # versioned release for v* tags
      - name: Package versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        run: mv TWASE-macOS-release.zip "TWASE-macOS-${GITHUB_REF_NAME}.zip"

      - name: Create versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: TWASE macOS ${{ github.ref_name }}
          files: TWASE-macOS-${{ github.ref_name }}.zip
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
